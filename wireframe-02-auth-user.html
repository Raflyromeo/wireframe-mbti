<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe 02 — Autentikasi User (Masuk)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #e8e8e8; color: #222; font-size: 13px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    /* Blob latar belakang */
    .wf-blob1 { position: fixed; width: 320px; height: 320px; border-radius: 50%; background: #ddd; opacity: 0.4; top: -80px; left: -80px; pointer-events: none; }
    .wf-blob2 { position: fixed; width: 320px; height: 320px; border-radius: 50%; background: #ddd; opacity: 0.4; bottom: -80px; right: -80px; pointer-events: none; }
    .wf-dots { position: fixed; inset: 0; background-image: radial-gradient(#bbb 1px, transparent 1px); background-size: 18px 18px; opacity: 0.15; pointer-events: none; }
    /* Kartu */
    .wf-wrap { width: 420px; position: relative; z-index: 1; }
    .wf-back { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .wf-back-icon { width: 14px; height: 14px; background: #bbb; border: 1px solid #999; flex-shrink: 0; }
    .wf-card { background: #fff; border: 2px solid #bbb; padding: 36px; }
    .wf-card-title { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 6px; }
    .wf-card-desc { font-size: 11px; color: #888; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .wf-google-btn { width: 100%; padding: 16px; border: 2px solid #ccc; background: #f5f5f5; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 900; font-size: 13px; }
    .wf-google-icon { width: 24px; height: 24px; background: #ddd; border: 1px solid #bbb; border-radius: 3px; flex-shrink: 0;
      /* Google logo dibuat dari 4 blok warna abu2 */
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; padding: 3px; }
    .wf-google-q1 { background: #aaa; border-radius: 50% 0 0 0; }
    .wf-google-q2 { background: #ccc; border-radius: 0 50% 0 0; }
    .wf-google-q3 { background: #bbb; border-radius: 0 0 0 50%; }
    .wf-google-q4 { background: #999; border-radius: 0 0 50% 0; }
  </style>
</head>
<body>
  <div class="wf-blob1"></div>
  <div class="wf-blob2"></div>
  <div class="wf-dots"></div>
  <div class="wf-wrap">
    <!-- ← Kembali ke Beranda -->
    <div class="wf-back">
      <div class="wf-back-icon"></div>
      Kembali ke Beranda
    </div>
    <!-- Kartu Login -->
    <div class="wf-card">
      <div class="wf-card-title">Masuk</div>
      <div class="wf-card-desc">Masuk dengan akun Google Anda untuk memulai tes MBTI dan menyimpan profil kepribadian Anda.</div>
      <div class="wf-google-btn">
        <div class="wf-google-icon">
          <div class="wf-google-q1"></div>
          <div class="wf-google-q2"></div>
          <div class="wf-google-q3"></div>
          <div class="wf-google-q4"></div>
        </div>
        Masuk dengan Google
      </div>
    </div>
  </div>
</body>
</html>
